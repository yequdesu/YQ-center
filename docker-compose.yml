version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yequ
      POSTGRES_PASSWORD: yequ
      POSTGRES_DB: yequ
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yequ"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YeQu Gateway</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',monospace;background:#0d1117;color:#c9d1d9;display:flex;align-items:center;justify-content:center;height:100vh}
.login-box{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:32px;width:340px;text-align:center}
.login-box h1{font-size:20px;color:#58a6ff;margin-bottom:8px}
.login-box p{font-size:12px;color:#8b949e;margin-bottom:20px}
.login-box input{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 14px;color:#c9d1d9;font-size:14px;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:#58a6ff}
.login-box button{width:100%;padding:10px;background:#238636;border:none;border-radius:6px;color:white;font-size:14px;cursor:pointer}
.login-box button:hover{background:#2ea043}
.error{color:#f85149;font-size:12px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="login-box">
  <h1>YeQu Gateway</h1>
  <p>个人数据中心</p>
  <input type="text" id="username" placeholder="Username" autofocus>
  <input type="password" id="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Sign In</button>
  <div class="error" id="error">Invalid username or password</div>
</div>
<script>
async function login() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (!u || !p) return;
  const resp = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: u, password: p}),
  });
  if (resp.ok) {
    window.location.href = '/dashboard';
  } else {
    document.getElementById('error').style.display = 'block';
  }
}
</script>
</body>
</html>

[project]
name = "node-win-client"
version = "0.1.0"
description = "A lightweight Windows YQP node client and Center/Agent integration tester."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pywebview>=5.0",
    "pystray>=0.19.5",
    "pywin32>=306",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-psutil>=7.0.0",
]
metrics = [
    "psutil>=5.9.0",
]

[project.scripts]
node-win = "node_win_client.cli:app"

[tool.setuptools.packages.find]
include = ["node_win_client*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true

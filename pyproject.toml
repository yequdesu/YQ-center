[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yequ"
version = "0.1.0"
description = "YeQu Center — personal infrastructure control center"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "structlog>=24.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "uvicorn[standard]>=0.30",
    "jsonschema>=4.20",
    "click>=8.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.11",
]

[project.scripts]
yequ = "yequ.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/yequ"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/yequ/api/**" = ["B008"]
"alembic/versions/*.py" = ["E501", "F401", "I001", "UP007", "UP035", "W291"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

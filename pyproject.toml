[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "yequ-gateway"
version = "0.1.0"
description = "YeQu Gateway - Personal Data Hub"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "httpx>=0.27",
    "redis>=5.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
yequ = "yequ.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

agent:
  provider: anthropic
  model: claude-sonnet-4-6
  api_key: ""
collector:
  interval_seconds: 60
data:
  dir: ~/.local/share/yequ-gateway
gateway:
  host: 0.0.0.0
  port: 9800
  unix_socket: ~/.local/share/yequ-gateway/gateway.sock
monitor:
  scan_interval_seconds: 30
notify:
  log_file: ~/.local/share/yequ-gateway/gateway.log

# YeQu Gateway 主配置
gateway:
  host: "127.0.0.1"
  port: 9800
  unix_socket: "~/.local/share/yequ-gateway/gateway.sock"

data:
  dir: "~/.local/share/yequ-gateway"

monitor:
  scan_interval_seconds: 30

collector:
  interval_seconds: 60

agent:
  provider: anthropic           # anthropic | openai | ollama (future)
  model: claude-sonnet-4-6      # or claude-opus-4-8, gpt-4o, etc.
  api_key: ""                   # leave empty to use env var (ANTHROPIC_API_KEY)

notify:
  log_file: "~/.local/share/yequ-gateway/gateway.log"

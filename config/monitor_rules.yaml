rules:
  - name: device_offline
    description: "设备心跳超时"
    condition:
      type: heartbeat_timeout
      params:
        multiplier: 3
    severity: warning
    cooldown_seconds: 300
    notify: true

  - name: disk_high
    description: "磁盘使用率过高"
    condition:
      type: threshold
      params:
        capability: system_metrics
        field: disk_usage_percent
        operator: ">"
        value: 90
    severity: critical
    cooldown_seconds: 1800
    notify: true

  - name: capability_silent
    description: "Capability 静默超时"
    condition:
      type: capability_silent
      params:
        multiplier: 5
    severity: warning
    cooldown_seconds: 600
    notify: true

  - name: command_timeout
    description: "指令超时未完成"
    condition:
      type: command_timeout
      params: {}
    severity: warning
    cooldown_seconds: 300
    notify: true
